<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GreenPulse 数字孪生监控大屏</title>
  <desc id="desc">数字孪生监控大屏原型，展示绿电比例、GPU 利用率、碳强度、绿色 Token 产量、多时间尺度能源与负荷时序、Pod 状态和当前调度决策。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23B26D"/>
      <stop offset="1" stop-color="#62D68E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B2D5B" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="36" fill="url(#bg)"/>

  <text x="72" y="76" fill="#0F2341" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">数字孪生监控大屏</text>
  <text x="72" y="110" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="18">面向绿色 Token 生产的多时间尺度能源-算力协同视图</text>

  <rect x="72" y="144" width="260" height="112" rx="24" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadow)"/>
  <text x="100" y="184" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="15">绿电占比</text>
  <text x="100" y="228" fill="#0F2341" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">72%</text>
  <rect x="218" y="201" width="76" height="14" rx="7" fill="#E4F4EB"/>
  <rect x="218" y="201" width="55" height="14" rx="7" fill="url(#green)"/>

  <rect x="364" y="144" width="260" height="112" rx="24" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadow)"/>
  <text x="392" y="184" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="15">GPU 利用率</text>
  <text x="392" y="228" fill="#0F2341" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">64%</text>
  <rect x="510" y="201" width="76" height="14" rx="7" fill="#E8F1FC"/>
  <rect x="510" y="201" width="49" height="14" rx="7" fill="#0B63CE"/>

  <rect x="656" y="144" width="260" height="112" rx="24" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadow)"/>
  <text x="684" y="184" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="15">电网碳强度</text>
  <text x="684" y="228" fill="#0F2341" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">184</text>
  <text x="760" y="226" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="16">gCO₂/kWh</text>

  <rect x="948" y="144" width="260" height="112" rx="24" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadow)"/>
  <text x="976" y="184" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="15">绿色 Token 产量</text>
  <text x="976" y="228" fill="#0F2341" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">1.28M</text>

  <rect x="72" y="292" width="768" height="334" rx="28" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadow)"/>
  <text x="104" y="336" fill="#0F2341" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">能源 × 负荷时序</text>
  <text x="104" y="362" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="14">将弹性 AI 负荷时移到低碳绿电窗口</text>

  <line x1="112" y1="538" x2="800" y2="538" stroke="#DCE8F6" stroke-width="2"/>
  <line x1="112" y1="420" x2="800" y2="420" stroke="#EEF4FA" stroke-width="2"/>
  <line x1="112" y1="478" x2="800" y2="478" stroke="#EEF4FA" stroke-width="2"/>
  <path d="M112 505C170 472 206 452 262 468C320 485 350 402 412 396C488 390 512 442 572 430C648 415 680 360 800 376" stroke="#1B9B5D" stroke-width="5" stroke-linecap="round"/>
  <path d="M112 522C188 523 232 522 304 522C358 522 376 488 432 486C502 483 542 505 604 506C680 508 708 455 800 452" stroke="#0B63CE" stroke-width="5" stroke-linecap="round"/>

  <rect x="260" y="552" width="156" height="34" rx="17" fill="#EAF6EF"/>
  <text x="338" y="574" text-anchor="middle" fill="#167A45" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">微调 A · 运行</text>
  <rect x="546" y="552" width="184" height="34" rx="17" fill="#EAF6EF"/>
  <text x="638" y="574" text-anchor="middle" fill="#167A45" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">离线推理 · 运行</text>

  <text x="112" y="594" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="13">00:00</text>
  <text x="328" y="594" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="13">08:00</text>
  <text x="548" y="594" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="13">16:00</text>
  <text x="770" y="594" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="13">24:00</text>
  <circle cx="666" cy="342" r="6" fill="#1B9B5D"/>
  <text x="682" y="347" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="13">绿电</text>
  <circle cx="766" cy="342" r="6" fill="#0B63CE"/>
  <text x="782" y="347" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="13">负荷</text>

  <rect x="872" y="292" width="336" height="160" rx="28" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadow)"/>
  <text x="904" y="336" fill="#0F2341" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">当前调度决策</text>
  <rect x="904" y="362" width="260" height="44" rx="22" fill="#EAF6EF"/>
  <text x="1034" y="390" text-anchor="middle" fill="#167A45" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">微调 A 延迟至 12:00</text>
  <text x="904" y="426" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="14">原因：即将进入绿电高峰，且 Pod-B 算力充足</text>

  <rect x="872" y="482" width="336" height="144" rx="28" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadow)"/>
  <text x="904" y="526" fill="#0F2341" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Pod 状态</text>
  <text x="904" y="562" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="14">Pod-A · 在线推理 · 78%</text>
  <rect x="1110" y="550" width="62" height="10" rx="5" fill="#E8F1FC"/>
  <rect x="1110" y="550" width="48" height="10" rx="5" fill="#0B63CE"/>
  <text x="904" y="592" fill="#5E6F86" font-family="Inter, Arial, sans-serif" font-size="14">Pod-B · 微调窗口 · 42%</text>
  <rect x="1110" y="580" width="62" height="10" rx="5" fill="#E8F1FC"/>
  <rect x="1110" y="580" width="26" height="10" rx="5" fill="#0B63CE"/>
</svg>
