<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GreenPulse 企业能力架构</title>
  <desc id="desc">企业能力架构图，展示绿色能耗智能和算力能效智能共同输入 AI 协同调度大脑，并驱动集群执行与绿色 Token 生产分析。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="blue" x1="220" y1="88" x2="1058" y2="642" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B63CE"/>
      <stop offset="1" stop-color="#1D8BFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B2D5B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="36" fill="url(#bg)"/>
  <circle cx="1110" cy="82" r="126" fill="#EAF4FF"/>
  <circle cx="186" cy="648" r="168" fill="#EFF8F3"/>

