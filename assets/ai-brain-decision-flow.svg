  <text x="640" y="596" text-anchor="middle" fill="#167A45" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">反馈闭环：实际功耗 · Token 产量 · SLA 结果 · 预测误差 · 碳核算</text>
