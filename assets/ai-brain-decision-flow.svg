  <text x="1085" y="322" text-anchor="middle" fill="#0B63CE" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">启动</text>
  <text x="1085" y="362" text-anchor="middle" fill="#0B63CE" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">延迟</text>
  <text x="1085" y="402" text-anchor="middle" fill="#0B63CE" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">扩缩容</text>
  <text x="1085" y="442" text-anchor="middle" fill="#0B63CE" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">资源分配</text>

