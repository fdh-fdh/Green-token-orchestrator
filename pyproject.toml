[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenpulse"
version = "0.1.0"
description = "GreenPulse — 面向绿色 Token 智算工厂的能源-算力协同调度框架(Digital Twin MVP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0,<7",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<8",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["greenpulse*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = "-q"
